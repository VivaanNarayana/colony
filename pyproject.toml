[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colony-memory"
version = "0.1.0"
description = "Self-hosted, evidence-checked shared memory for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "cryptography>=43", "pydantic>=2.9,<3", "sqlite-vec>=0.1.6,<0.2",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
colony = "colony.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colony"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "SIM"]
