name: Evaluator validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluator:
    # This job reports targeted evaluator validation, not the eight benchmark gates.
    name: Evaluator unit tests and lint
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test and lint tools
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9" "ruff>=0.11,<1"
      - name: Run provider-free evaluator unit tests
        # These modules use retained evidence and synthetic imports. The shared
        # product conftest is unnecessary and imports application dependencies.
        run: >-
          python -m pytest --noconftest -q -p no:cacheprovider
          tests/test_benchmark_independence.py
          tests/test_local_evidence_audit.py
          tests/test_lookup_audit_integrity.py
          tests/test_lookup_gates.py
      - name: Lint evaluator scripts and tests
        run: >-
          python -m ruff check --no-cache
          scripts/analyze_lookup_live.py
          scripts/audit_lookup_local.py
          scripts/benchmark_lookup.py
          scripts/benchmark_lookup_live.py
          scripts/benchmark_statistics.py
          scripts/lookup_benchmark_worker.py
          scripts/lookup_workload.py
          tests/test_benchmark_independence.py
          tests/test_local_evidence_audit.py
          tests/test_lookup_audit_integrity.py
          tests/test_lookup_gates.py
